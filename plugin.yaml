name: workbuddy
label: WorkBuddy Models
version: 1.4.1
kind: standalone
description: >
  Turn models from a WorkBuddy desktop sign-in (domestic codebuddy.cn or
  international workbuddy.ai) into OpenAI-compatible endpoints Hermes can use
  as a named provider: `hermes workbuddy setup` starts a loopback gateway and
  writes the provider entries plus per-model aliases (`wb-*` / `wbg-*`), and
  `hermes workbuddy login` adds an account by signing in through a browser —
  no desktop app required on the Hermes machine.

  Disclosure: the gateway is a small Node sidecar (vendor-built, from
  dingminhua/dsh-connect-workbuddy, MIT) that the plugin starts on 127.0.0.1
  (ports 8787 CN / 8788 global by default). It reads WorkBuddy sign-ins it was
  given — browser-OAuth tokens it stored itself in
  `~/.hermes/workbuddy`, and, when a desktop auth file is present, that file —
  refreshes them against the WorkBuddy endpoints, and forwards chat
  completions; credentials never leave the machine except to WorkBuddy's own
  API. `setup` writes `providers.workbuddy`, `providers.workbuddy-global`,
  per-model `model_aliases`, and `WORKBUDDY_GATEWAY_TOKEN` in
  `~/.hermes/.env` (unless already set); it starts no other service and sends
  no telemetry. Session titles Hermes generates are re-pointed at a free
  model by default (`--session-title-model hy3`), which keeps them off the
  paid credit line.

  Autostart: the plugin keeps the gateway alive alongside Hermes — it starts it
  on session start, guarantees it before any workbuddy model call, a 30s
  watchdog restarts it after a crash, and the plugin repairs its own
  `$HERMES_HOME/hooks/workbuddy-autostart` boot hook at load time so a
  container restart brings the endpoint back with the gateway. Disable with
  `WORKBUDDY_AUTOSTART=0` or `hermes workbuddy autostart off`.

  In-session channel: `/workbuddy` shows the gateway card and runs the account
  operations (browser sign-in, switch billing account, sign out, refresh model
  aliases, autostart) through the host's own clarify picker, so updating a
  sign-in never needs a model turn. Its second menu item is a one-click daily
  check-in (`/workbuddy checkin`, also `签到`): it claims every stored account's
  reward, is idempotent upstream, and can run once a day by itself
  (`/workbuddy checkin auto on`, logged to `$HERMES_HOME/workbuddy/checkin.log`).

  Buddy travel (派猫猫): `/workbuddy travel` (and `hermes workbuddy travel`) runs
  the closed loop on every stored account — claim a landed reward first, then
  dispatch again — read-only with `--status`, a destination with `--location 1-4`,
  and once a day by itself with `travel auto on`. `checkin --travel` does both in
  one run. Travel lives on a different host from the credit meter
  (www.workbuddy.cn, no /v2 prefix), so it is implemented in the gateway next to
  the check-in calls that already own the credentials and the token refresh.

  Push notifications: `hermes workbuddy notify [status|test]` reports the channel
  readiness and sends a test; when `$HERMES_HOME/workbuddy/notify.json` enables
  it, check-in and travel runs push their summary (webhook, DingTalk, Feishu,
  WeCom, Slack, Telegram, Bark, email, or a local JSONL log). Paid channels are
  deliberately not implemented, and a push never changes a run's outcome.
author: hermes-workbuddy contributors
license: MIT
platforms:
  - linux
  - macos
  - windows
requires_hermes: ">=0.22.0"
repository: https://github.com/just-mositima/hermes-workbuddy
provides_tools: []
provides_hooks:
  - on_session_start
  - pre_api_request
  - pre_auxiliary_call
provides_middleware: []
