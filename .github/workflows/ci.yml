name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Hermes-facing half: manifest + operator CLI.
  plugin:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile the plugin modules
        run: python -m py_compile __init__.py cli.py
      - name: plugin.yaml parses and carries the required keys
        run: |
          pip install --quiet pyyaml
          python - <<'EOF'
          import pathlib
          import yaml
          doc = yaml.safe_load(pathlib.Path("plugin.yaml").read_text())
          for key in ("name", "version", "kind", "description"):
              assert doc.get(key), f"plugin.yaml is missing {key!r}"
          assert doc["kind"] == "standalone", doc["kind"]
          print("plugin.yaml ok:", doc["name"], doc["version"])
          EOF
      - name: The pre-built gateway is committed
        run: test -f gateway/lib/bin.js

  # The gateway half (Node): keep the vendored build honest.
  gateway:
    name: gateway (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gateway/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      # `hermes plugins install` ships the committed `gateway/lib`, so a
      # source change without a rebuilt lib would hand users stale code.
      - name: committed lib/ is current
        if: runner.os == 'Linux'
        run: git diff --exit-code -- lib

  # The pi-ai 1.x leg, carried over from the upstream project: the gateway's
  # adapter code (kept for parity, exercised by the same tests) is written
  # against both pi-ai generations, and only a body-level assertion on a real
  # 1.x copy catches the pass-through failure mode the 0.85 leg cannot see.
  gateway-pi-ai-next:
    name: gateway (pi-ai ${{ matrix.pi-ai }})
    timeout-minutes: 25
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    strategy:
      fail-fast: false
      matrix:
        pi-ai: ["1.1.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gateway/pnpm-lock.yaml
      - name: Pin pi-ai ${{ matrix.pi-ai }} in the override block
        run: |
          sed -i "s|'@earendil-works/pi-ai': .*|'@earendil-works/pi-ai': ${{ matrix.pi-ai }}|" pnpm-workspace.yaml
          grep "@earendil-works/pi-ai" pnpm-workspace.yaml
      - run: pnpm install --no-frozen-lockfile
      - name: Assert the installed pi-ai is the one under test
        run: |
          ACTUAL=$(node -p "require('./node_modules/@earendil-works/pi-ai/package.json').version")
          echo "installed pi-ai: $ACTUAL"
          test "$ACTUAL" = "${{ matrix.pi-ai }}"
      - run: pnpm run typecheck
      - run: pnpm run test
